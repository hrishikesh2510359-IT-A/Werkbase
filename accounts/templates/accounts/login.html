{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Werkbase — Sign In</title>
    <link rel="stylesheet" href="{% static 'accounts/style.css' %}">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo">Werkbase</div>
            <h1>Sign in to your account</h1>

            {% if error %}
                <div class="error-banner">{{ error }}</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="field">
                    <label for="id_email">Email</label>
                    {{ form.email }}
                </div>
                <div class="field">
                    <label for="id_password">Password</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn-primary">Log In</button>
                <div class="helper-row">
                    <a href="#">Forgot password?</a>
                </div>
            </form>

            <div class="divider"><span>or</span></div>

            <a href="{% url 'google_login_stub' %}" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33C2.44 15.98 5.48 18 9 18z"/>
                    <path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.96H.96A8.996 8.996 0 000 9c0 1.45.35 2.83.96 4.04l3.01-2.33z"/>
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
                </svg>
                Sign in with Google
            </a>

            <div class="footer-link">
                Don't have an account? <a href="{% url 'signup' %}">Sign up</a>
            </div>
        </div>
    </div>
</body>
</html>
